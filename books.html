<body data-page="books">

      <h1 data-i18n="books_head_title">مكتبة الكتب والمراجع الجغرافية</h1>

    </div>
  </header>

  <section class="band">
    <div class="wrap">

      <!-- شريط البحث والتصفية -->
      <div class="books-toolbar">

        <div class="search-box">
          <label for="book-search" class="visually-hidden" data-i18n="books_search_label">ابحث في المكتبة</label><input type="search" id="book-search" class="input" placeholder="ابحث عن كتاب، مؤلف، أو موضوع…" data-i18n-attr="placeholder:books_search_placeholder">

        <div class="filter-pills" id="category-filters" role="group">

          <button class="pill" type="button" aria-pressed="false" data-cat="hydrology" data-i18n="courses_filter_hydro">الهيدرولوجيا</button>
          <button class="pill" type="button" aria-pressed="false" data-cat="programming" data-i18n="courses_filter_prog">البرمجة والأتمتة</button>
        </div>
      </div>

      <!-- شبكة الكتب -->
      <div class="books-grid" id="books-container">
        <p class="empty" data-i18n="books_loading">جارٍ تحميل مكتبة الكتب…</p>
      </div>

    </div>
  </section>
